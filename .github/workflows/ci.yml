# Verifies the Docker image still builds on every push and pull request,
# so the Dockerfile doesn't rot as the code evolves.
name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t ebay-mcp .
