[project]
name = "ebay-mcp"
version = "0.1.0"
description = "MCP server exposing eBay Buy APIs (Browse, Offer, Order) as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",   # v1 FastMCP API; v2 renamed FastMCP -> MCPServer (see README)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live eBay sandbox API tests (require EBAY_CLIENT_ID/EBAY_CLIENT_SECRET)",
]
